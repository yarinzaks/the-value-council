[project]
name = "the-value-council"
version = "0.1.0"
description = "Ten AI agents modeled after legendary value investors, each managing a paper-money portfolio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "The Value Council" }]
keywords = ["finance", "investing", "value-investing", "llm", "gemini", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "google-generativeai>=0.8.0",
    "yfinance>=0.2.40",
    "edgartools>=2.0.0",
    "requests>=2.31.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agents*"]
exclude = ["dashboard*", "docs*", "logs*"]

# -----------------------------------------------------------------------------
# Ruff (linter + formatter)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
    # Typographic characters in prose are deliberate throughout this
    # codebase — "10×", "current − prior", "≤ 0.5". These rules exist to
    # catch a Cyrillic 'а' masquerading as a Latin one in an identifier,
    # which is a real hazard; they do not distinguish that from an
    # en-dash in a docstring, and 79 of them fire on documentation that
    # is correct as written. Rewriting the prose to satisfy the linter
    # would degrade it. RUF001 stays on for string literals, where the
    # character can actually reach a comparison.
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    # RUF001 fires on string literals, where the character could in
    # principle reach a comparison, so it was kept on to check. All five
    # hits are display text — "1.0× book", "− 40 AAPL", "sh × price" —
    # and one is Hebrew: `מ׳` in a dashboard string, where the geresh is
    # the correct abbreviation mark and ruff's suggested grave accent
    # would be wrong. The rule cannot tell a bilingual UI string from a
    # homoglyph attack, and this project has the former throughout.
    "RUF001",  # ambiguous unicode in strings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
# Discover every tests/ package under core/ and agents/. The previous
# explicit list silently omitted buffett, lynch, marks, klarman and
# fisher — 322 passing tests that guarded nothing because they never ran.
testpaths = [
    "core",
    "agents",
    "scripts",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not integration",
]
markers = [
    "integration: tests that hit live APIs (require .env)",
    "slow: tests that take more than a second",
]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = true
# agents/ has no __init__.py, so mypy resolves agents/dreman/contrarian.py
# as both "dreman.contrarian" and "agents.dreman.contrarian" and aborts
# before checking anything. These two make the declared layout analysable.
namespace_packages = true
explicit_package_bases = true
