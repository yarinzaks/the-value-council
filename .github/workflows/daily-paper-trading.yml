name: Daily Paper Trading

# Runs the paper-trading scanner on a multi-market schedule.
#
# Anchors, not crons
# ------------------
# What matters for each run is the moment the work actually happens —
# the anchor, expressed in New York time. The cron is only a wake-up
# call fired an hour or two early, and the "Hold until the anchor" step
# parks the job until the anchor arrives. That step carries the
# measurements and the reasoning.
#
# US market — Mon-Fri. Half an hour after the open, then every two
# hours, then half an hour after the close:
#   - anchor 10:00 ET (17:00 IL) -> open  -> full scan + trades
#   - anchor 12:00 ET (19:00 IL) -> close -> mark-to-market only
#   - anchor 14:00 ET (21:00 IL) -> close -> mark-to-market only
#   - anchor 16:30 ET (23:30 IL) -> close -> mark-to-market only
#     (30 min after the bell so Yahoo has published the settled daily
#     bar; running at 16:00 ET re-read the morning's intraday quote)
#
# Only the first scans and trades. The other three refresh the marks so
# the dashboard tracks the session instead of showing a price struck
# before the open until it closes again.
#
# The trading scan moved from 09:35 to 10:00 ET on the same reasoning
# that put the closing one at 16:30: let the session settle first. The
# opening minutes carry the widest spreads of the day, and a doctrine
# that holds for 30 days gains nothing by transacting into them.
#
# The scan takes 25-45 min — it fetches ~209 tickers one at a time — so
# its data lands 17:25-17:45 IL rather than on the anchor. The three
# mark-only runs take about a minute and do land on theirs. Nothing can
# move the scan's arrival earlier without starting it before 10:00 ET.
#
# A run at 23:00 IL was requested and is not here. 23:00 IL is 16:00 ET
# — the bell itself — and that is the exact bug the 16:30 ET anchor
# exists to avoid; see the parenthesis above.
#
# Cron is UTC and has no daylight-saving rule, so the anchors are New
# York time and scripts/hold_until_anchor.py resolves them through
# America/New_York. Fixed UTC anchors were wrong at both ends of the
# day every winter: 14:00 UTC is 09:00 EST, half an hour before the
# open, and 20:30 UTC is 15:30 EST, half an hour before the bell — the
# two failures these anchors exist to prevent.
#
# Anchoring to ET holds all four at 10:00 / 12:00 / 14:00 / 16:30 ET
# year-round. The Israeli clock times quoted above hold with them for
# most of the year, because two zones both on summer time or both on
# standard time stay exactly seven hours apart. They part only while
# one has switched and the other has not: Israel leaves summer time on
# the last Sunday of October and the US on the first Sunday of
# November, and in spring the US moves first. Over the next 401 days
# that is 18 of them, in two windows, and in those the runs land an
# hour earlier in Israel — 16:00 rather than 17:00. The dashboard's
# advertised times do not model this; see the note on SCHEDULE in
# dashboard/src/lib/timestamps.ts.
#
# TASE (Tel Aviv) — Sun-Thu, and deliberately not held:
#   - 06:00 UTC -> 09:00 IL -> open  -> placeholder (Israeli scanner WIP)
#   - 14:30 UTC -> 17:30 IL -> close -> placeholder (Israeli scanner WIP)
# They produce zero trades, so when they land changes no number
# anywhere. Holding them would only park them in the concurrency queue
# ahead of the US scan, which does change numbers. Give them anchors
# when the Israeli scanner ships and starts moving a book.
#
# A few schedule notes:
#   - Sun is a TASE trading day but NOT a US one (cron 0-4 = Sun-Thu).
#   - Fri is a US trading day but NOT a TASE one (cron 1-5 = Mon-Fri).
#   - On Mon-Thu, both markets fire — 4 runs/day total.
#   - The TASE runs currently produce zero trades on purpose. The
#     schedule and --market plumbing exist so when the Israeli scanner
#     lands, it slots in without changing infra.
#
# Cache:
# - data/fundamentals_cache: downloaded from cache-latest release
#   (US-only — refreshed weekly by Refresh EDGAR cache workflow).
# - data/cache (price + universe-index): actions/cache, run-id keyed.

# The cron expression as the run title. Every run in the Actions list
# read "Daily Paper Trading" before this, which made them impossible to
# tell apart at a glance and left the watchdog with no way to ask "did
# the US open run happen today?" — the runs API exposes this string as
# display_title, so it can now match on it exactly.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} {1} (manual)', inputs.market, inputs.mode)
      || github.event.schedule }}

on:
  schedule:
    # TASE fires at its anchor — see the header for why it is not held.
    # TASE open  (Sun-Thu 06:00 UTC = 09:00 IL)
    - cron: '0 6 * * 0-4'
    # TASE close (Sun-Thu 14:30 UTC = 17:30 IL)
    - cron: '30 14 * * 0-4'

    # US fires before its anchor and holds. Anchors are New York time,
    # so the lead is 60 min under EDT and 120 under EST. The anchor= on
    # each line must match what the dispatch step emits for that cron;
    # scripts/tests/test_workflow_schedule.py enforces it in both
    # offsets, so a cron edited without its anchor fails the suite
    # instead of quietly running outside the session.
    # US +30m open  -> 10:00 ET (17:00 IL) -> scan + trade
    - cron: '0 13 * * 1-5'    # anchor 10:00 ET
    # US midday     -> 12:00 ET (19:00 IL) -> mark only
    - cron: '0 15 * * 1-5'    # anchor 12:00 ET
    # US afternoon  -> 14:00 ET (21:00 IL) -> mark only
    - cron: '0 17 * * 1-5'    # anchor 14:00 ET
    # US +30m close -> 16:30 ET (23:30 IL) -> mark only
    - cron: '30 19 * * 1-5'   # anchor 16:30 ET

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        default: 'open'
        options:
          - open
          - close
      market:
        description: 'Market to scan'
        required: true
        type: choice
        default: 'US'
        options:
          - US
          - TASE
          - both

permissions:
  contents: write

env:
  # Opt into Node.js 24 for JavaScript actions ahead of GitHub's
  # 2026-06-02 forced default. Suppresses the Node 20 deprecation
  # warning and lets us validate Node 24 compatibility now rather
  # than on the day of the cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # One queue for every run of this workflow, so no two can be inside
  # the commit-and-push step at once.
  #
  # This was previously keyed per cron, on the reasoning that US and
  # TASE runs should not block each other on the Mon-Thu overlap days.
  # That held while they were 55 minutes apart. Moving the US scan to
  # 14:00 UTC put it 30 minutes ahead of the TASE close, and the
  # slowest run measured took 29.7 — close enough that two jobs would
  # eventually race on `git push` and one would fail.
  #
  # Blocking is the right behaviour here rather than something to
  # avoid: a run that waits its turn is strictly better than a run that
  # fails on a non-fast-forward. cancel-in-progress stays false so the
  # queued run still happens.
  #
  # The hold makes the lock coarser — a US job now owns this group from
  # the moment its cron fires until its scan finishes, up to three hours
  # under EST. The only thing that can queue behind it is the TASE
  # close, which is exactly why TASE is not held: it trades nothing, so
  # arriving late costs nothing, and letting it hold the lock instead
  # would delay the run that does move a book.
  group: daily-paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 60 min absorbed normal yfinance variance (measured 0.8 min for a
    # mark-only run, 24.7 at p90, 45.2 at worst — the bottleneck is the
    # per-ticker fetch loop in core.live.runner, and batching is the
    # proper fix, tracked separately). "Hold until the anchor" now adds
    # up to 120 on top of that under EST, so: 120 waiting plus 45
    # working plus setup still leaves headroom inside 180.
    timeout-minutes: 180

    env:
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
      TRIGGER_INPUT_MODE: ${{ inputs.mode }}
      TRIGGER_INPUT_MARKET: ${{ inputs.market }}
      TRIGGER_NAME: ${{ github.event_name }}
      TARGET_REF: ${{ github.ref_name }}
      SEC_USER_AGENT: 'value-council research@yarinzaks.dev'
      VALUE_COUNCIL_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Decide run mode + market
        id: dispatch
        run: |
          # Map cron expression -> (mode, market, anchor). Each cron has
          # a unique triple, so the dispatch is deterministic.
          #
          # anchor is the UTC HH:MM the work should begin at. Empty means
          # "start immediately" — the two TASE crons already fire at their
          # anchor, and a manual run is a human asking for it now.
          case "$TRIGGER_NAME:$TRIGGER_SCHEDULE" in
            workflow_dispatch:*)
              echo "mode=$TRIGGER_INPUT_MODE" >> "$GITHUB_OUTPUT"
              echo "market=$TRIGGER_INPUT_MARKET" >> "$GITHUB_OUTPUT"
              echo "anchor=" >> "$GITHUB_OUTPUT"
              ;;
            *":0 6 * * 0-4")
              echo "mode=open" >> "$GITHUB_OUTPUT"
              echo "market=TASE" >> "$GITHUB_OUTPUT"
              echo "anchor=" >> "$GITHUB_OUTPUT"
              ;;
            *":30 14 * * 0-4")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=TASE" >> "$GITHUB_OUTPUT"
              echo "anchor=" >> "$GITHUB_OUTPUT"
              ;;
            *":0 13 * * 1-5")
              echo "mode=open" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              echo "anchor=10:00" >> "$GITHUB_OUTPUT"
              ;;
            # Midday and afternoon are mark-to-market only, deliberately.
            # The doctrines read quarterly filings and hold for at least
            # 30 days: across 67 days of logs Benjamin Graham traded on
            # one. Re-running the scan mid-session would re-derive the
            # same book from the same filings and buy nothing. What these
            # do change is the dashboard, which otherwise shows a mark
            # struck before the US session opened until it closes again.
            *":0 15 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              echo "anchor=12:00" >> "$GITHUB_OUTPUT"
              ;;
            *":0 17 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              echo "anchor=14:00" >> "$GITHUB_OUTPUT"
              ;;
            *":30 19 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              echo "anchor=16:30" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unrecognized trigger: $TRIGGER_NAME / $TRIGGER_SCHEDULE"
              exit 1
              ;;
          esac

      - name: Prepare data directories
        run: mkdir -p data/portfolios data/decisions data/snapshots data/cache data/cron_logs data/fundamentals_cache

      - name: Download EDGAR cache from release (US runs only)
        # TASE runs don't need the EDGAR cache — the Israeli scanner
        # uses Maya, not SEC. Skip the download to save ~30 sec.
        if: steps.dispatch.outputs.market != 'TASE'
        run: |
          if ! gh release download cache-latest --pattern 'fundamentals_cache.tar.gz' --dir /tmp; then
            echo "::error::cache-latest release missing. Run the 'Refresh EDGAR cache' workflow first."
            exit 1
          fi
          tar -xzf /tmp/fundamentals_cache.tar.gz -C data/
          find data/fundamentals_cache -name '._*' -delete 2>/dev/null || true
          n=$(find data/fundamentals_cache -name '*.parquet' -not -name '._*' 2>/dev/null | wc -l)
          echo "::notice::extracted $n parquet files from release"
          if [ "$n" -lt 500 ]; then
            echo "::error::release contained too few parquet files ($n). Refresh workflow may have published a corrupt asset."
            exit 1
          fi

      - name: Restore price + universe-index cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-v2-${{ steps.dispatch.outputs.market }}-${{ github.run_id }}
          restore-keys: |
            prices-v2-${{ steps.dispatch.outputs.market }}-
            prices-v2-

      - name: Hold until the anchor
        # GitHub treats scheduled events as best-effort, and for this
        # repository that is not a small effect. Measured over 51
        # scheduled runs the delay was a median of 51 minutes, a minimum
        # of 4 and a maximum of 109 — and on 2026-08-14 the 14:00 run
        # did not fire at all.
        #
        # Moving the crons an hour earlier would drag the median onto
        # the target and leave the spread untouched, and for two of the
        # four it would be actively wrong: a punctual 13:00 fire would
        # scan and trade before the 13:30 open, and a punctual 19:30
        # fire would mark the book on an intraday quote instead of the
        # settled close — the bug the 20:30 anchor exists to avoid.
        #
        # So the cron is demoted to a wake-up call an hour early and the
        # job waits here. Whatever the scheduler did, the work starts at
        # the anchor. The market correctness and the arrival time both
        # stop being a lottery, and the only case still uncovered is a
        # delay longer than the 60-minute lead, which lands where it
        # would have landed anyway.
        #
        # Idling is free here because the repository is public and
        # Actions minutes on public repositories are unmetered. On a
        # private repository this step would be the wrong design — four
        # holds a day would consume most of the free monthly allowance.
        # A module rather than an inline script: the anchor has to be
        # resolved through America/New_York, and putting that arithmetic
        # somewhere scripts/tests/test_hold_until_anchor.py can reach it
        # is worth more than saving a file. It also keeps the workflow
        # free of GNU date's parsing dialect, which nothing on a Mac can
        # check before it ships.
        if: steps.dispatch.outputs.anchor != ''
        env:
          ANCHOR: ${{ steps.dispatch.outputs.anchor }}
        run: python -m scripts.hold_until_anchor --anchor "$ANCHOR"

      - name: Run paper-trading scanner
        # `shell: bash` is load-bearing, not style. The default shell runs
        # `bash -e` without pipefail, so `python ... | tee` reported tee's
        # exit code and a scanner that died mid-run looked successful.
        shell: bash
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
          MARKET: ${{ steps.dispatch.outputs.market }}
        run: |
          python -m scripts.run_daily_paper_trading \
            --mode "$MODE" --market "$MARKET" \
            2>&1 | tee "data/cron_logs/daily.${MARKET}.${MODE}.log"

      # The Council is a separate step because it is a separate kind of
      # agent: it produces no weights, trades nothing, and its failure
      # must not take the eleven down with it. `|| true` is deliberate
      # for exactly that reason — a FRED outage or an SEC 403 should
      # leave the dashboard's council page stale, not fail the run that
      # actually moved the books.
      - name: Run the Council (US only, never trades)
        if: steps.dispatch.outputs.market != 'TASE'
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: |
          python -m scripts.run_council --mode "$MODE" \
            2>&1 | tee "data/cron_logs/council.${MODE}.log" || true

      - name: Verify run produced real trading state (US only)
        if: steps.dispatch.outputs.market != 'TASE'
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: python -m scripts.verify_run_state --mode "$MODE"

      - name: Commit updated state back to the repo
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
          MARKET: ${{ steps.dispatch.outputs.market }}
        run: |
          # GitHub's own Actions identity, with the canonical
          # ID-prefixed noreply. The previous value,
          # council-bot@users.noreply.github.com, is the legacy
          # format without an account ID, which GitHub resolves to
          # whoever currently holds the username - a real, dormant
          # account created six weeks before this repo existed. It
          # was credited with 148 commits and stood as the top
          # contributor. This address belongs to no one and cannot
          # be claimed.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # prices/ and sectors.json join the commit because the site is
          # now built in the cloud from this repo, not served from the
          # Mac. DailyRunner already writes both on every run (see
          # export_prices / export_sectors in core/live/runner.py) — they
          # were simply staying on the runner and being thrown away with
          # it, so a cloud build had no position price charts and no
          # sector donut. Everything here is small: 209 price series are
          # 2.4M in total and sectors.json is 4K.
          git add data/portfolios data/decisions data/snapshots data/cron_logs \
                  data/prices data/sectors.json data/council
          if git diff --cached --quiet; then
            echo "no data changes — nothing to commit"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "auto: paper-trading run ${MARKET} ${MODE} ${STAMP}"
          git pull --rebase origin "$TARGET_REF" || true
          git push origin "HEAD:${TARGET_REF}"

      - name: Upload run logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-logs-${{ steps.dispatch.outputs.market }}-${{ steps.dispatch.outputs.mode }}-${{ github.run_id }}
          path: data/cron_logs/daily.*.log
          retention-days: 30
