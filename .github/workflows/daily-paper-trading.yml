name: Daily Paper Trading

# Runs the paper-trading scanner on a multi-market schedule.
#
# US market — Mon-Fri:
#   - 13:35 UTC -> 09:35 ET (16:35 IL) -> open  -> full scan + trades
#   - 20:00 UTC -> 16:00 ET (23:00 IL) -> close -> mark-to-market only
#
# TASE (Tel Aviv) — Sun-Thu:
#   - 06:00 UTC -> 09:00 IL -> open  -> placeholder (Israeli scanner WIP)
#   - 14:30 UTC -> 17:30 IL -> close -> placeholder (Israeli scanner WIP)
#
# A few schedule notes:
#   - Sun is a TASE trading day but NOT a US one (cron 0-4 = Sun-Thu).
#   - Fri is a US trading day but NOT a TASE one (cron 1-5 = Mon-Fri).
#   - On Mon-Thu, both markets fire — 4 runs/day total.
#   - The TASE runs currently produce zero trades on purpose. The
#     schedule and --market plumbing exist so when the Israeli scanner
#     lands, it slots in without changing infra.
#
# Cache:
# - data/fundamentals_cache: downloaded from cache-latest release
#   (US-only — refreshed weekly by Refresh EDGAR cache workflow).
# - data/cache (price + universe-index): actions/cache, run-id keyed.

on:
  schedule:
    # TASE open  (Sun-Thu 06:00 UTC = 09:00 IL)
    - cron: '0 6 * * 0-4'
    # TASE close (Sun-Thu 14:30 UTC = 17:30 IL)
    - cron: '30 14 * * 0-4'
    # US open    (Mon-Fri 13:35 UTC = 09:35 ET = 16:35 IL)
    - cron: '35 13 * * 1-5'
    # US close   (Mon-Fri 20:00 UTC = 16:00 ET = 23:00 IL)
    - cron: '0 20 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        default: 'open'
        options:
          - open
          - close
      market:
        description: 'Market to scan'
        required: true
        type: choice
        default: 'US'
        options:
          - US
          - TASE
          - both

permissions:
  contents: write

env:
  # Opt into Node.js 24 for JavaScript actions ahead of GitHub's
  # 2026-06-02 forced default. Suppresses the Node 20 deprecation
  # warning and lets us validate Node 24 compatibility now rather
  # than on the day of the cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # Each (market, mode) pair has its own queue so US and TASE runs
  # don't block each other on the Mon-Thu overlap days.
  group: daily-paper-trading-${{ github.event.schedule || format('manual-{0}-{1}', inputs.market, inputs.mode) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 60 min absorbs normal yfinance variance (typical run 14-26 min,
    # tail ~30 min when the price API is slow). The bottleneck is
    # the per-ticker yfinance fetch loop in core.live.runner; batching
    # is the proper fix and is tracked separately.
    timeout-minutes: 60

    env:
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
      TRIGGER_INPUT_MODE: ${{ inputs.mode }}
      TRIGGER_INPUT_MARKET: ${{ inputs.market }}
      TRIGGER_NAME: ${{ github.event_name }}
      TARGET_REF: ${{ github.ref_name }}
      SEC_USER_AGENT: 'value-council research@yarinzaks.dev'
      VALUE_COUNCIL_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Decide run mode + market
        id: dispatch
        run: |
          # Map cron expression -> (mode, market). Each cron has a
          # unique pair, so the dispatch is deterministic.
          case "$TRIGGER_NAME:$TRIGGER_SCHEDULE" in
            workflow_dispatch:*)
              echo "mode=$TRIGGER_INPUT_MODE" >> "$GITHUB_OUTPUT"
              echo "market=$TRIGGER_INPUT_MARKET" >> "$GITHUB_OUTPUT"
              ;;
            *":0 6 * * 0-4")
              echo "mode=open" >> "$GITHUB_OUTPUT"
              echo "market=TASE" >> "$GITHUB_OUTPUT"
              ;;
            *":30 14 * * 0-4")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=TASE" >> "$GITHUB_OUTPUT"
              ;;
            *":35 13 * * 1-5")
              echo "mode=open" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              ;;
            *":0 20 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "market=US" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unrecognized trigger: $TRIGGER_NAME / $TRIGGER_SCHEDULE"
              exit 1
              ;;
          esac

      - name: Prepare data directories
        run: mkdir -p data/portfolios data/decisions data/snapshots data/cache data/cron_logs data/fundamentals_cache

      - name: Download EDGAR cache from release (US runs only)
        # TASE runs don't need the EDGAR cache — the Israeli scanner
        # uses Maya, not SEC. Skip the download to save ~30 sec.
        if: steps.dispatch.outputs.market != 'TASE'
        run: |
          if ! gh release download cache-latest --pattern 'fundamentals_cache.tar.gz' --dir /tmp; then
            echo "::error::cache-latest release missing. Run the 'Refresh EDGAR cache' workflow first."
            exit 1
          fi
          tar -xzf /tmp/fundamentals_cache.tar.gz -C data/
          find data/fundamentals_cache -name '._*' -delete 2>/dev/null || true
          n=$(find data/fundamentals_cache -name '*.parquet' -not -name '._*' 2>/dev/null | wc -l)
          echo "::notice::extracted $n parquet files from release"
          if [ "$n" -lt 500 ]; then
            echo "::error::release contained too few parquet files ($n). Refresh workflow may have published a corrupt asset."
            exit 1
          fi

      - name: Restore price + universe-index cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-v2-${{ steps.dispatch.outputs.market }}-${{ github.run_id }}
          restore-keys: |
            prices-v2-${{ steps.dispatch.outputs.market }}-
            prices-v2-

      - name: Run paper-trading scanner
        # `shell: bash` is load-bearing, not style. The default shell runs
        # `bash -e` without pipefail, so `python ... | tee` reported tee's
        # exit code and a scanner that died mid-run looked successful.
        shell: bash
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
          MARKET: ${{ steps.dispatch.outputs.market }}
        run: |
          python -m scripts.run_daily_paper_trading \
            --mode "$MODE" --market "$MARKET" \
            2>&1 | tee "data/cron_logs/daily.${MARKET}.${MODE}.log"

      - name: Verify run produced real trading state (US only)
        if: steps.dispatch.outputs.market != 'TASE'
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: python -m scripts.verify_run_state --mode "$MODE"

      - name: Commit updated state back to the repo
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
          MARKET: ${{ steps.dispatch.outputs.market }}
        run: |
          git config user.name  "council-bot"
          git config user.email "council-bot@users.noreply.github.com"
          git add data/portfolios data/decisions data/snapshots data/cron_logs
          if git diff --cached --quiet; then
            echo "no data changes — nothing to commit"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "auto: paper-trading run ${MARKET} ${MODE} ${STAMP}"
          git pull --rebase origin "$TARGET_REF" || true
          git push origin "HEAD:${TARGET_REF}"

      - name: Upload run logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-logs-${{ steps.dispatch.outputs.market }}-${{ steps.dispatch.outputs.mode }}-${{ github.run_id }}
          path: data/cron_logs/daily.*.log
          retention-days: 30
