name: Daily Paper Trading

# Runs the paper-trading scanner Mon-Fri on a US-market schedule.
# Two scheduled triggers per weekday:
#
#   - 13:35 UTC -> 09:35 EDT (16:35 IL) -> "open" mode -> full scan + trades
#   - 20:00 UTC -> 16:00 EDT (23:00 IL) -> "close" mode -> mark-to-market only
#
# How fundamentals are loaded
# ---------------------------
# We download the EDGAR XBRL parquet cache from a GitHub release
# (tag: cache-latest). The Refresh EDGAR cache workflow rebuilds and
# republishes that release every Monday — a separate, slow workflow
# that this fast daily one depends on but doesn't pay for.
#
# If cache-latest is missing or the download fails, the daily run
# fails fast with a clear pointer to the refresh workflow. We do NOT
# silently fall back to a cold prefetch — that would burn 30-60 min
# of every run and likely 403 from SEC.

on:
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        default: 'open'
        options:
          - open
          - close

permissions:
  contents: write

concurrency:
  group: daily-paper-trading-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
      TRIGGER_INPUT_MODE: ${{ inputs.mode }}
      TRIGGER_NAME: ${{ github.event_name }}
      TARGET_REF: ${{ github.ref_name }}
      SEC_USER_AGENT: 'value-council research@yarinzaks.dev'
      VALUE_COUNCIL_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Decide run mode
        id: mode
        run: |
          if [ "$TRIGGER_NAME" = "workflow_dispatch" ]; then
            echo "mode=$TRIGGER_INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER_SCHEDULE" = "0 20 * * 1-5" ]; then
            echo "mode=close" >> "$GITHUB_OUTPUT"
          else
            echo "mode=open" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare data directories
        run: mkdir -p data/portfolios data/decisions data/snapshots data/cache data/cron_logs data/fundamentals_cache

      # Download the EDGAR cache from the cache-latest release.
      # The release is built+pushed by the Refresh EDGAR cache workflow.
      - name: Download EDGAR cache from release
        run: |
          if ! gh release download cache-latest --pattern 'fundamentals_cache.tar.gz' --dir /tmp; then
            echo "::error::cache-latest release missing. Run the 'Refresh EDGAR cache' workflow first (Actions tab > Refresh EDGAR cache > Run workflow)."
            exit 1
          fi
          tar -xzf /tmp/fundamentals_cache.tar.gz -C data/
          # Defensive: strip any macOS AppleDouble (._*) sidecar files
          # the tarball may carry. These crash pyarrow when it tries
          # to read them as parquet, killing the universe load.
          find data/fundamentals_cache -name '._*' -delete 2>/dev/null || true
          n=$(find data/fundamentals_cache -name '*.parquet' -not -name '._*' 2>/dev/null | wc -l)
          echo "::notice::extracted $n parquet files from release"
          if [ "$n" -lt 500 ]; then
            echo "::error::release contained too few parquet files ($n). Refresh workflow may have published a corrupt asset."
            exit 1
          fi

      - name: Restore price + universe-index cache
        # Keep using actions/cache here — it works fine for this small
        # subdirectory (~50MB price SQLite + small JSON indices). Each
        # run saves under a unique key; restore-keys grabs the latest.
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-v2-${{ github.run_id }}
          restore-keys: |
            prices-v2-

      - name: Run paper-trading scanner
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python -m scripts.run_daily_paper_trading --mode "$MODE" 2>&1 | tee "data/cron_logs/daily.${MODE}.log"

      - name: Verify run produced real trading state
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python <<'PY'
          import json, os, sys
          from pathlib import Path
          mode = os.environ["MODE"]
          portfolios = Path("data/portfolios")
          all_seed = True
          for f in sorted(portfolios.glob("*.json")):
              d = json.loads(f.read_text())
              if d.get("positions"):
                  all_seed = False
              print(f"  {d['agent']}: nav=${d['total_nav']:.2f} positions={len(d.get('positions', []))}")
          if mode == "open" and all_seed:
              print("::error::all portfolios came back at $10K seed — universe likely empty (cache corrupt?)")
              sys.exit(1)
          print(f"sanity check passed (mode={mode})")
          PY

      - name: Commit updated state back to the repo
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name  "council-bot"
          git config user.email "council-bot@users.noreply.github.com"
          git add data/portfolios data/decisions data/snapshots data/cron_logs
          if git diff --cached --quiet; then
            echo "no data changes — nothing to commit"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "auto: paper-trading run ${MODE} ${STAMP}"
          git pull --rebase origin "$TARGET_REF" || true
          git push origin "HEAD:${TARGET_REF}"

      - name: Upload run logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-logs-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: data/cron_logs/daily.*.log
          retention-days: 30
