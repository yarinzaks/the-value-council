name: Schedule Watchdog

# Why this exists
# ---------------
# GitHub Actions documents schedule events as best-effort: during high-load
# periods scheduled cron runs can be delayed by 10-30+ minutes or skipped
# entirely. Our paper-trading runs are time-sensitive (they fetch live
# prices), so a missed run leaves the portfolios un-marked-to-market for
# the day. This watchdog runs shortly after each US schedule and dispatches
# a make-up workflow_dispatch run if the scheduled one didn't fire (or
# failed). Self-healing.
#
# How it decides
# --------------
# It asks one question per schedule: did the run for this cron happen
# today, and did it end healthily? That is a per-day question, not an
# age-in-minutes one. The age test this replaced could not survive the
# hold that daily-paper-trading.yml now performs — a run created at
# 13:00 and working at 14:00 is "110 minutes old" by 14:50 and perfectly
# healthy — nor could it tell a US run apart from a TASE one, since
# every run in the list was titled "Daily Paper Trading".
#
# Both problems are solved by run-name in that workflow, which puts the
# triggering cron expression in display_title. Matching it exactly
# identifies the run precisely and needs no timing assumptions at all.
#
# What it does NOT do
# -------------------
# - Doesn't keep the repo "alive" — that 60-day inactivity rule is a
#   different mechanism and isn't relevant here (we commit ~daily).
# - Doesn't cover TASE schedules. The Israeli scanner is still WIP and
#   produces zero trades, so a missed TASE run is harmless. Add a TASE
#   branch here when the scanner ships.
# - Doesn't dispatch back-to-back. daily-paper-trading.yml runs under a
#   single concurrency group, so a duplicate dispatch queues rather
#   than racing, and each cron is audited once a day.

on:
  schedule:
    # After the US open run should have finished: it is woken at 13:00,
    # starts work at its 14:00 anchor and takes up to 45 min, so it is
    # done by 14:45. 15:00 is the first honest moment to ask.
    - cron: '0 15 * * 1-5'
    # After the US close run: woken 19:30, works at 20:30, takes about a
    # minute. 21:00 as before.
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

permissions:
  # Needed to dispatch other workflows via gh workflow run.
  actions: write
  contents: read

env:
  # See daily-paper-trading.yml for the rationale — Node 20 → 24
  # opt-in ahead of the 2026-06-02 forced default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine which run to audit
        id: mode
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Each schedule below audits exactly one cron of
          # daily-paper-trading.yml. `audit` is that cron verbatim: it is
          # what that workflow publishes as its run title, so it is the
          # key this watchdog matches on. workflow_dispatch is a manual
          # trigger — pick by wall-clock to keep the same behavior.
          case "$EVENT_SCHEDULE" in
            "0 15 * * 1-5")
              echo "mode=open" >> "$GITHUB_OUTPUT"
              echo "audit=0 13 * * 1-5" >> "$GITHUB_OUTPUT"
              ;;
            "0 21 * * 1-5")
              echo "mode=close" >> "$GITHUB_OUTPUT"
              echo "audit=30 19 * * 1-5" >> "$GITHUB_OUTPUT"
              ;;
            *)
              hour=$(date -u +%H)
              if [ "$hour" -ge 18 ]; then
                echo "mode=close" >> "$GITHUB_OUTPUT"
                echo "audit=30 19 * * 1-5" >> "$GITHUB_OUTPUT"
              else
                echo "mode=open" >> "$GITHUB_OUTPUT"
                echo "audit=0 13 * * 1-5" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Inspect today's run for the audited cron
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUDIT: ${{ steps.mode.outputs.audit }}
        run: |
          # Filter on event=schedule so this evaluates cron health rather
          # than its own past dispatches: a make-up run that succeeded
          # does not prove the schedule fired, and next weekday's audit
          # must be free to catch the same cron failing again.
          runs=$(gh api \
            "repos/${GH_REPO}/actions/workflows/daily-paper-trading.yml/runs?event=schedule&per_page=50")

          # Midnight UTC today. The audited cron fires once per weekday,
          # so "created today" and "this cycle" are the same statement,
          # and unlike an age threshold it stays true however long the
          # run held before starting work.
          since=$(date -u -d "$(date -u +%F)T00:00:00Z" +%s)

          summary=$(echo "$runs" | jq -r \
            --arg audit "$AUDIT" --argjson since "$since" '
              [ .workflow_runs[]
                | select(.display_title == $audit)
                | select((.created_at | fromdateiso8601) >= $since) ]
              | if length == 0 then "missing"
                elif any(.[]; .status != "completed" or .conclusion == "success")
                  then "healthy"
                else "failed:" + (.[0].conclusion // "unknown")
                end')

          echo "audit=${AUDIT} since=$(date -u -d "@${since}" -Iseconds) -> ${summary}"

          case "$summary" in
            healthy)
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              echo "reason=${AUDIT} ran today and is healthy" >> "$GITHUB_OUTPUT"
              ;;
            missing)
              echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
              echo "reason=${AUDIT} did not fire today" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
              echo "reason=${AUDIT} ran today but ended ${summary#failed:}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Dispatch make-up run
        if: steps.check.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Load-bearing, and its absence is why this workflow has never
          # once healed anything. `gh workflow run` resolves the target
          # repository from the local git remote, and this job has no
          # checkout step, so every dispatch it ever attempted died on
          # "fatal: not a git repository" — including 2026-08-14T14:44Z,
          # where it correctly detected the missing 14:00 run, correctly
          # decided to re-run it, and then failed on this line. The check
          # step below already set GH_REPO; this one did not.
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.mode.outputs.mode }}
          REASON: ${{ steps.check.outputs.reason }}
          REF: ${{ github.ref_name }}
        run: |
          echo "::warning::dispatching make-up run (mode=${MODE}): ${REASON}"
          gh workflow run daily-paper-trading.yml \
            --repo "$GH_REPO" \
            --ref "$REF" \
            --field "mode=${MODE}" \
            --field "market=US"

      - name: Report healthy
        if: steps.check.outputs.should_dispatch != 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::notice::watchdog healthy: ${REASON}"
